[project]
name = "minimaxh3-director"
description = "Videos of any length with MiniMax H3: shots on a timeline, characters, voices, songs, storyboard and control videos, rendered part by part in ComfyUI's native loop. Nine example workflows and a guide; the Legacy timeline Director is included."
version = "1.0.1"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = ["opencv-python>=4.8"]
classifiers = [
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
]

[project.urls]
Repository = "https://github.com/seesee75-commits/ComfyUI-MiniMaxH3-Director"
"Bug Tracker" = "https://github.com/seesee75-commits/ComfyUI-MiniMaxH3-Director/issues"

[tool.comfy]
# Must match the publisher you create at https://registry.comfy.org
PublisherId = "seesee75-commits"
DisplayName = "MiniMax H3 Director"
Icon = ""
# NG depends on native List loops; this release is validated against ComfyUI 0.37.0.
requires-comfyui = ">=0.37.0"
